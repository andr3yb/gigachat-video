services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gigachat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigachat}
      POSTGRES_DB: ${POSTGRES_DB:-gigachat_video}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gigachat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: asskkord/gigachat:gigachat-video-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gigachat}:${POSTGRES_PASSWORD:-gigachat}@postgres:5432/${POSTGRES_DB:-gigachat_video}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    image: asskkord/gigachat:gigachat-video-backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gigachat}:${POSTGRES_PASSWORD:-gigachat}@postgres:5432/${POSTGRES_DB:-gigachat_video}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: asskkord/gigachat:gigachat-video-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/uploads:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  uploads:
